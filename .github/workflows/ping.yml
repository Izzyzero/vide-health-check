name: Check VIDE health

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request health endpoint
        env:
          HEALTH_URL: ${{ vars.VIDE_HEALTH_URL }}
        run: |
          curl --fail --show-error --silent \
            --connect-timeout 15 \
            --max-time 120 \
            "$HEALTH_URL"
